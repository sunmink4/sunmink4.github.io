<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.tagline | default: site.description }}">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦷</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header class="site-header">
    <div class="wrap">
        <a class="logo" href="{{ '/' | relative_url }}">
            <span class="logo-mark" aria-hidden="true">🦷</span>
            {{ site.title }}
        </a>
        <nav class="top-nav">
            <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}aria-current="page"{% endif %}>앱</a>
            <a href="https://github.com/{{ site.github }}" target="_blank" rel="noopener">GitHub ↗</a>
        </nav>
    </div>
</header>

<main>
    {{ content }}
</main>

<footer class="site-footer">
    <div class="wrap">
        <span>© {{ 'now' | date: "%Y" }} {{ site.github }}</span>
        <a href="https://github.com/{{ site.github }}">github.com/{{ site.github }}</a>
    </div>
</footer>

<script src="{{ '/assets/js/releases.js' | relative_url }}"></script>

</body>
</html>
